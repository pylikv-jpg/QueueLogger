name: Generate QueueLogger Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Generate permanent Android keystore
        env:
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore QueueLogger-release.jks \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias queuelogger \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=QueueLogger, OU=Android, O=QueueLogger, L=Vilnius, C=LT"

      - name: Convert keystore to Base64
        run: |
          base64 -w 0 QueueLogger-release.jks > QueueLogger-keystore-base64.txt

      - name: Upload keystore package
        uses: actions/upload-artifact@v4
        with:
          name: QueueLogger-permanent-keystore
          path: |
            QueueLogger-release.jks
            QueueLogger-keystore-base64.txt
          retention-days: 1
